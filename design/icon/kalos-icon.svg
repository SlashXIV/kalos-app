<?xml version="1.0" encoding="UTF-8"?>
<!--
    Kalos — icone d'application, source de reference.

    Meme grammaire que Brut, Dromos et Topo : une lettre dessinee a la main
    (cap 29, de y=35 a y=64), un trait d'accent dessous, la palette de l'appli
    et un detail lie au metier. Canevas des icones adaptatives Android :
    108x108, dont seuls les 72x72 centraux sont garantis visibles, et seul un
    cercle de 66 de diametre survit au masque le plus agressif.

    Ce fichier est la SOURCE. Les VectorDrawable de `app/src/main/res/drawable/`
    en derivent (ic_launcher_background / _foreground / _monochrome et
    ic_splash_logo) : toute modification se fait ici d'abord, puis se reporte
    dans les XML.

    - Le trait d'accent est la REGLE graduee verte, signature de Kalos depuis
      la 1.3 : 9 graduations, extremites et centre plus hautes.
    - Le detail metier est l'ANNEAU DES MACROS : trois arcs (proteines, glucides,
      lipides) dans les couleurs de NutrientColors (theme sombre), longueurs
      32 / 43 / 25 % comme une repartition type. Rayon 30.5, trait 2.6 : tout
      l'anneau tient dans le cercle de 66, comme les graduations de Brut.

    ZONE D'EXCLUSION : x 36.5..71.5 y 33..74 (lettre et regle, marge de 2).
    L'anneau passe a plus de 29 du centre, hors de ses coins (27.3).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <defs><clipPath id="squircle"><path d="M54,0 C86,0 108,22 108,54 C108,86 86,108 54,108 C22,108 0,86 0,54 C0,22 22,0 54,0 Z"/></clipPath></defs>
  <g clip-path="url(#squircle)">
    <rect width="108" height="108" fill="#0F1113"/>
    <g fill="none" stroke-width="2.6" stroke-linecap="round">
      <path stroke="#8A78EE" d="M58.24,23.80 A30.5,30.5 0 0,1 83.03,63.34"/>
      <path stroke="#BA841C" d="M79.33,70.98 A30.5,30.5 0 0,1 24.17,60.34"/>
      <path stroke="#D45A80" d="M23.57,51.87 A30.5,30.5 0 0,1 49.76,23.80"/>
    </g>
    <path fill="#E8EAE6" d="M41.5,35 H50 V47.5 L57.5,35 H66.5 L57.8,48.2 L67,64 H57.6 L52.3,54.4 L50,57.8 V64 H41.5 Z"/>
    <path stroke="#3CCB98" stroke-width="1.6" stroke-linecap="round"
          d="M39.5,66.8 V72 M43.13,69 V72 M46.75,69 V72 M50.38,69 V72 M54,66.8 V72
             M57.63,69 V72 M61.25,69 V72 M64.88,69 V72 M68.5,66.8 V72"/>
  </g>
</svg>
